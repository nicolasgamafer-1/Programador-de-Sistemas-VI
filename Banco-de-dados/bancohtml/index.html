<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Estoque</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 15px; margin-right: 5px; cursor: pointer; border: none; border-radius: 4px; color: white; }
    .btn-salvar { background-color: #28a745; }
    .btn-carregar { background-color: #007bff; }
    .btn-editar { background-color: #ffc107; color: black; }
    .btn-deletar { background-color: #dc3545; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #333; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h1>Gerenciamento de Estoque</h1>

  <form id="form-produto">
    <input type="hidden" id="codigo">
    
    <div class="form-group">
      <label>Nome do Produto:</label>
      <input type="text" id="produto" required>
    </div>
    
    <div class="form-group">
      <label>Quantidade:</label>
      <input type="number" id="quantidade" required>
    </div>
    
    <div class="form-group">
      <label>Preço Unitário:</label>
      <input type="number" step="0.01" id="preco" required>
    </div>

    <button type="submit" id="btn-salvar" class="btn-salvar">Salvar (INSERT)</button>
    <button type="button" onclick="limparFormulario()" style="background:#6c757d;">Cancelar</button>
  </form>

  <hr style="margin: 25px 0;">

  <h2>Lista de Produtos (SELECT)</h2>
  <button class="btn-carregar" onclick="carregarProdutos()">Atualizar Tabela</button>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Preço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-corpo"></tbody>
  </table>
</div>

<script>
  const API_URL = '/api/estoque';

  document.addEventListener('DOMContentLoaded', carregarProdutos);

  async function carregarProdutos() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('Erro na requisição');
      const dados = await res.json();

      const tbody = document.getElementById('tabela-corpo');
      tbody.innerHTML = '';

      dados.forEach(item => {
        const preco = parseFloat(item.preco_unitario || item.preco || 0);
        tbody.innerHTML += `
          <tr>
            <td>${item.codigo}</td>
            <td>${item.produto}</td>
            <td>${item.quantidade}</td>
            <td>R$ ${preco.toFixed(2)}</td>
            <td>
              <button class="btn-editar" onclick="prepararEdicao(${item.codigo}, '${item.produto}', ${item.quantidade}, ${preco})">Editar</button>
              <button class="btn-deletar" onclick="deletarProduto(${item.codigo})">DELETE</button>
            </td>
          </tr>
        `;
      });
    } catch (err) {
      console.error('Erro ao carregar lista:', err);
    }
  }

  document.getElementById('form-produto').addEventListener('submit', async (e) => {
    e.preventDefault();

    const codigo = document.getElementById('codigo').value;
    const produto = document.getElementById('produto').value;
    const quantidade = parseInt(document.getElementById('quantidade').value);
    const preco_unitario = parseFloat(document.getElementById('preco').value);

    const payload = { produto, quantidade, preco_unitario };

    try {
      if (codigo) {
        await fetch(`${API_URL}/${codigo}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } else {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }

      limparFormulario();
      carregarProdutos();
    } catch (err) {
      alert('Erro ao salvar no banco de dados!');
    }
  });

  async function deletarProduto(codigo) {
    if (confirm(`Deseja excluir o produto #${codigo}?`)) {
      await fetch(`${API_URL}/${codigo}`, { method: 'DELETE' });
      carregarProdutos();
    }
  }

  function prepararEdicao(codigo, produto, quantidade, preco) {
    document.getElementById('codigo').value = codigo;
    document.getElementById('produto').value = produto;
    document.getElementById('quantidade').value = quantidade;
    document.getElementById('preco').value = preco;
    document.getElementById('btn-salvar').innerText = 'Atualizar (UPDATE)';
  }

  function limparFormulario() {
    document.getElementById('codigo').value = '';
    document.getElementById('form-produto').reset();
    document.getElementById('btn-salvar').innerText = 'Salvar (INSERT)';
  }
</script>

</body>
</html>
